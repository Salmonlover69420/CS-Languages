<!DOCTYPE html>
<html>

<head>
    <title>New HTML5 Input Types</title>
</head>

<body>
    <h1 style="color:blue">Input Types</h1>
    This form demonstrates the HTML5 input types and the placeholder, required and autofocus attributes.
    <form method="Post" action=" " autocomplete="on">
        <!--can put <input> inside label-->
        <p><label> Color: </label>
            <input form name="Color: " type="color">
        </p>
        <p><label> Date: </label>
            <input name="Date: " type="date">
        </p>
        <p><label> Datetime-local: </label>
            <input name="Color: " type="datetime-local">
        </p>
        <p><label> Number: </label>
            <input name="Number: " type="number" step="1" min="0" max="7" placeholder="0">
        </p>
        <p><label> Range: </label>
            0
            <input name="Range: " type="range" placeholder="0" min="0" max="20" value="10"> <!-- to be completed-->
            20
        </p>
        <p><label> Email: </label>
            <input name="Email: " type="email" placeholder="name@domain.com" required>
        </p>
        <p><label> Search: </label>
            <input name="Search: " type="search" placeholder="search query">
            (Enter your search query here.)
        </p>
        <p><label> Tel: </label>
            <input name="Tel: " type="tel" placeholder="(###) ###-####" pattern="\(d{3})\ + \d{3}-\d{4}" required>
            <!--\ inputs the strings, d{3} sets for 3 integers, + concatenation-->
            (###) ###-####
        </p>
        <p><label> Time: </label>
            <input name="Time: " type="time">
            (hh:mm)
        </p>
        <p><label> URL: </label>
            <input name="URL: " type="url" placeholder="http://www.domainname.com">
            (http://www.domainname.com)
        </p>
        <p><label> Week: </label>
            <input name="Week: " type="week">
        </p>
        <p><label></label>
            <input value="Submit" type="submit">
            <input value="Reset" type="Clear">
        </p>
    </form>

    <details>
        <summary> always visible and at the top </summary>
        <!-- doesnt matter if put summary above to below, but must be inside details tag -->
         <ul>
            <li>iughegh</li>
            <li>sdghfdg</li>
         </ul>
    </details>
</body>

</html>
