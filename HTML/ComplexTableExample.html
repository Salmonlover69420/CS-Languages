<!DOCTYPE html>
<html>

<head>
    <title>Complex Table</title>
</head>

<body>
    <h1>Table Example: Spanning Rows and Columns</h1>

    <table border="1">
        <caption>A more complex sample table</caption>
        <thead>
            <tr>
                <th rowspan=2><img src="camel.jpg" width=200 height=100></th>
                <th colspan=4>Camelid Comparison...</th>
            </tr>
            <tr>
                <th># of humps</th>
                <th>region</th>
                <th>spits?</th>
                <th>produces wool?</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Camels (bactrian)</th>
                <td>2</td>
                <td>Africa/Asia</td>
                <td>Yes</td>
                <td>Yes</td>
            </tr>
            <tr>
                <th>Llamas</th>
                <td>1</td>
                <td>Andes Mountains</td>
                <td>Yes</td>
                <td>Yes</td>
            </tr>
        </tbody>
    </table>
</body>
<!--thead and tbody not necessary here-->
</html>
