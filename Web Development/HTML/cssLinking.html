<html>

<head>
    <title>
        CSS Linking Example
    </title>
    <style type="text/css"> /*type="text/css" is not necessary*/ /*This is an internal CSS */
        span {
            color: blue;
        }

        h1 {
            color: pink;
            font-size: 24pt;
        }
    </style>
    <link rel="stylesheet" href="/CSS/Intro.css" type="text/css"> <!-- type="text/css" not necessary --> <!-- this is an external CSS -->
</head>

<body>
    <p style="color:red; font-size: 20pt;">dgdfgdfg</p> <!-- Inline CSS -->
    <div style="color: green; border:1px dashed black">sdjfds</div>
    <!-- note: div and span allow adding inline style, div also creates a new line, span doesnt-->
    <h1>this is h1</h1><span>this is span</span>
</body>

</html>
