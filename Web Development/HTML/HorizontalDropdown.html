<html>
    <head>
        <style>
            h1 {
                margin: 20px;
            }

            button {
                width: 200px;
                padding: 20px 20px;
                background-color: black;
                color: white;
            }

            div {
                color: white;
                background-color: black;
                list-style-type: none;
                display: block;
                width: 200px;
            }

            nav div {
                display: none;
            }

            nav:hover div {
                display: block;
            }

            li {
                color: black;
                background-color: gray;
            }

            li a {
                display: block;
                padding: 20px;
                color: black;
                text-decoration-line: none;
            }

            li:hover a {
                background-color: white;
            }
        </style>
    </head>

    <body>
        <h1>Dropdown Menu</h1>
        <nav><button>Dropdown Menu</button>
            <div>
                <li><a href="">Link 1</a></li>
                <li><a href="">Link 2</a></li>
                <li><a href="">Link 3</a></li>
            </div>
        </nav>
    </body>
</html>
