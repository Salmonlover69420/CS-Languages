<html>

<head>
    <title>Bug report form</title>
</head>

<body>
    <form method="post">
        <h1>Bug Report form</h1>
        <fieldset>
            <legend>Report</legend>
            <label>
                Name: <input name="Name" type="text"><br>
            </label>
            <br>
            <label>
                Email: <input name="Email" type="email"><br>
            </label>

        </fieldset>

        <fieldset>
            <legend>Bug Details</legend>
            <label>
                Bug Title: <input name="BugTitle" type="text">
            </label>

            <br><br>

            <input name="Severity" id="low" type="radio"> <label for="low">Low</label>
            <input name="Severity" id="medium" type="radio" checked> <label for="medium">Medium</label>
            <input name="Severity" id="high" type="radio"> <label for="high">High</label>
            <input name="Severity" id="critical" type="radio"> <label for="critical">Critical</label>

            <br><br>

            Platforms:
            <input name="Platforms" id="windows" type="checkbox"> <label for="windows">Windows</label>
            <input name="Platforms" id="linux" type="checkbox"> <label for="windows">Linux</label>
            <input name="Platforms" id="macos" type="checkbox"> <label for="macos">MacOs</label>
            <input name="Platforms" id="android" type="checkbox"> <label for="android">Android</label>
            <input name="Platforms" id="ios" type="checkbox"> <label for="ios">iOS</label>

            <br><br>

            <label for="Browser">Browser: </label>
            <select id="Browser" name="Browser">
                <option value="Chrome" selected>Chrome</option>
                <option value="Firefox">Firefox</option>
                <option value="Edge">Edge</option>
                <option value="Safari">Safari</option>
            </select>

            <br><br>

            <label> Programming Language:
                <input type="text" name="ProgrammingLanguages" list="Languages">
                <datalist id="Languages">
                    <option value="C">
                    <option value="Java">
                    <option value="Python">
                    <option value="JavaScript">
                    <option value="PHP">
                </datalist>
                </input>
            </label>

            <br><br>

            <label for="Steps2Repro">Steps to Reproduce:</label><br>
            <textarea name="Steps2Repro" id="Steps2Repro" rows="6" cols="60"></textarea>

            <br><br>

            <label>Date found:
                <input type="date" name="Date">
            </label>
        </fieldset>

        <p>
            <input type="submit" formnovalidate>
            <input type="reset">
        </p>
    </form>
</body>

</html>
