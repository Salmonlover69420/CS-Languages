<html>

<head>
    <title>Shadow box</title>
    <style>
        body {
            margin-left: 40px;
        }

        div.card {
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 8px 4px rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
        }

        div.text {
            background-color: green;
            text-align: center;
            padding: 10px;
            font-size: 40px;
            color: white;
        }

        div.title {
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>My First Card</h1>
    <div class="card">
        <div class="text">
            <h1>Hi</h1>
        </div>
        <div class="title">
            September 1, 2026
        </div>
    </div>
</body>

</html>
