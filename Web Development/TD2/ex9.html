<!DOCTYPE html>
<html>
    <head>
        <style>
            /* 1. Superscript effect without <sup> */
            span.super {
                color: red;
                font-size: 11px;
                position: relative;
                top: -6px;
            }

            /* 2. Image with corner badge and bottom caption */
            div.photo-box {
                position: relative;
                width: 300px;
                height: 200px;
            }

            div.photo-box img {
                width: 300px;
                height: 200px;
                display: block;
            }

            span.badge {
                position: absolute;
                top: 10px;
                right: 10px;
                background-color: red;
                color: white;
                padding: 4px 8px;
                font-size: 12px;
            }

            div.caption {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                background-color: rgba(0, 0, 0, 0.6);
                color: white;
                padding: 8px;
                box-sizing: border-box;
            }

            /* 3. Fixed "Top" button */
            a.top-btn {
                position: fixed;
                bottom: 20px;
                right: 20px;
                background-color: #1f4e79;
                color: white;
                text-decoration: none;
                padding: 10px 15px;
                border-radius: 5px;
            }
        </style>
    </head>
    <body id="top">

        <p>Here is a normal sentence with <span class="super">raised red words</span></p>

        <div class="photo-box">
            <img src="../Images/camel.jpg" alt="Camel">
            <span class="badge">NEW</span>
            <div class="caption">Caption along the bottom edge</div>
        </div>

        <!-- Extra height just so you can test scrolling -->
        <div style="height: 1200px;"></div>

        <a href="#top" class="top-btn">↑ Top</a>

    </body>
</html>
