<html>
    <head>
        <style>
            div.card {
                background-color: white;
                width: 260px;
                border: 2px solid blue;
                border-radius: 10px;
                /* Space inside the border */
                padding-top: 15px;
                padding-bottom: 15px;
                padding-left: 20px;
                padding-right: 20px;
                /* Space outside the border */
                margin-top: 20px;
                margin-bottom: 20px;
                margin-left: 40px;
                margin-right: 40px;
            }

            div.box {
                width: 260px;
                border-top: 10px solid blue;
                border-right: 2px dashed red;
                border-bottom: 5px dotted purple;
                border-left: 8px solid green;
            }

            div.circle {
                background-color: orange;
                width: 100px;
                height: 100px;
                border-radius: 50px;
            }

            div.long {
                width: 300px;
                height: 90px;
                overflow: scroll;
                border: 1px solid black;
            }

            div.big {
                background-color: lightblue;
                width: 50%;
                margin-left: auto;
                margin-right: auto;
            }
        </style>
    </head>

    <body>
        <div class="card">
            <h1>Hi</h1>
            <p>Card content goes here.</p>
        </div>

        <div class="box">
            Box with four different borders.
        </div>

        <div class="circle"></div>

        <div class="long">
            <p>
                This is a long paragraph inside a 300px by 90px box. Because there is more text than can fit inside the
                90px height, scrollbars appear so you can read the rest of the text.
            </p>
        </div>

        <div class="big">Centered box taking half the page width</div>
    </body>
</html>
