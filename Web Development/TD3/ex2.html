<html>
    <head>
        <style>
            div {
                height: 160px;
                width: 160px;
                background-color: lightblue;
                display: inline-block;
            }

            .box1 {
                box-shadow: 10px 10px gray;

            }

            .box2 {
                box-shadow: 10px 10px 5px blue;
            }

            .box3 {
                background-color: pink;
                box-shadow: 10px 10px 5px purple inset;
            }

            .box4 {
                box-shadow: 0px 0px 5px blue, 5px 5px 5px red, 10px 10px 10px green;
            }


            .card1 {
                width: 220px;
                background-color: green;
                box-shadow: 0 0 5px;
            }

            .card2 {
                background-color: blue;
                width: 220px;
                box-shadow: 0 0 5px;
            }

            .title {
                text-align: center;
                color: white;
            }

            div .text {
                text-align: center;
                background-color: white;
                padding: 30px;
                height: 1.3em;
            }
        </style>
    </head>

    <body>
        <!-- BOXES -->
        <h1>Box Shadows</h1>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>


        <!-- CARDS -->
        <h1>Cards</h1>
        <div class="card1">
            <h1 class="title">Hi</h1>
            <div class="text">
                aa
            </div>
        </div>
        <div class="card2">
            <h1 class="title">CSS</h1>
            <div class="text">
                aa
            </div>
        </div>
    </body>
</html>
