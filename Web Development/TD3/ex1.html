<html>
    <head>
        <style>
            h1 {
                size: 40px;
                font-family: Georgia;
                text-shadow: 2px 2px 
            }

            h2 {
                size: 40px;
                font-family: Georgia;
                text-shadow: 3px 3px red;
            }

            h3 {
                size: 40px;
                font-family: Georgia;
                text-shadow: -3px -3px orange;
            }

            h4 {
                size: 40px;
                font-family: Georgia;
                text-shadow: 3px 3px 6px blue;
            }

            h5 {
                size: 40px;
                font-family: Georgia;
                color: white;
                background-color: #222222;
                text-shadow: 0px 0px 5px cyan;
            }

            h6 {
                size: 40px;
                font-family: Georgia;
                color: white;
                text-shadow: 0 0 1px black, 0 0 3px blue, 0 0 2px red; 
            }
        </style>
    </head>

    <body>
        <h1>Simple Shadow</h1>
        <h2>Red Shadow</h2>
        <h3>Shadow up and to the left</h3>
        <h4>Blurred Shadow</h4>
        <h5>Neon glow</h5>
        <h6>Multiple Shadows</h6>
    </body>
</html>
