<html>
    <head>
        <title>How Items Flex</title>
        <style>
            ul {
                display: flex;
                list-style: none;
                padding: 0;
                gap: 10px;
                border: 2px dashed #888;
            }

            li {
                flex: 1 0 200px;
                /* Stretch along main axis: growable (1) (flex-grow), not shrinkable (0) (flex-shrink), initial length of 200px (flex-basis) */
                background-color: #5bc0eb;
                color: white;
                font-family: sans-serif;
                font-weight: bold;
                padding: 20px;
                text-align: center;
            }

            #order-demo {
                display: flex;
                gap: 10px;
                margin-top: 20px;
                padding: 10px;
                border: 2px dashed gray;
            }

            .order-box {
                width: 100px;
                height: 100px;
                background-color: lightgreen;
                border: 2px solid teal;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: sans-serif;
                font-weight: bold;
            }

            .first {
                order: -1;
                /* Moves before items with default order (0) */
            }

            .last {
                order: 1;
                /* Moves after items with default order (0) */
            }
        </style>
    </head>

    <body>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>

        <div id="order-demo">
            <div class="order-box last">Box 1</div>
            <div class="order-box">Box 2</div>
            <div class="order-box first">Box 3</div>
            <div class="order-box">Box 4</div>
        </div>
    </body>
</html>
