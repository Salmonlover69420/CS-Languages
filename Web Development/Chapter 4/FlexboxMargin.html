<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aligning with Margins</title>
        <style>
            div {
                background-color: #14AF8F;
                width: 100%;
            }

            ul {
                display: flex;
                align-items: center;
                list-style: none;
            }

            li {
                color: white;
                font-family: sans-serif;
                font-weight: bold;
                padding-right: 16px;
            }

            li.logo {
                margin-right: auto;
            }

            img {
                height: 50px;
                width: 50px;
            }
        </style>
    </head>
    <body>

        <div>
            <ul>
                <li class="logo"><img src="../Images/camel.jpg" alt="Logo"></li>
                <li>About</li>
                <li>Blog</li>
                <li>Shop</li>
                <li>Contact</li>
            </ul>
        </div>

    </body>
</html>
