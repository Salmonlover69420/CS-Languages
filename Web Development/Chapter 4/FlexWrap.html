<html>
    <head>
        <title>Wrapping Flex Lines</title>
        <style>
            body {
                padding: 24px;
                color: #222;
            }

            h1 {
                color: #5bc0eb;
                font-weight: 400;
                margin-bottom: 8px;
            }

            code {
                color: #1464b8;
                font-weight: bold;
            }

            .demo-grid {
                display: flex;
                flex-wrap: wrap;
                /* Note: flex-flow : flex-direction flex-wrap  Example: flex-flow: row wrap; */
                gap: 40px;
                margin-top: 24px;
            }

            .label {
                margin-bottom: 8px;
                font-size: 1rem;
            }

            /* Flex Container */
            .flex-container {
                display: flex;
                width: 400px;
                border: 3px solid #1496b8;
                background-color: #fff;
            }

            /* Flex-wrap variations */
            .wrap {
                flex-wrap: wrap;
            }

            .wrap-reverse {
                flex-wrap: wrap-reverse;
            }

            .nowrap {
                flex-wrap: nowrap;
                overflow: hidden;
                /* Clips items if they can no longer squish */
            }

            /* Flex Items (4 per row when wrapping) */
            .item {
                width: 25%;
                height: 75px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-size: 2.2rem;
            }

            /* Repeating 5-color cycle */
            .item:nth-child(5n + 1) {
                background-color: #c04848;
            }

            /* Red */
            .item:nth-child(5n + 2) {
                background-color: #e8844c;
            }

            /* Orange */
            .item:nth-child(5n + 3) {
                background-color: #90bd3e;
            }

            /* Green */
            .item:nth-child(5n + 4) {
                background-color: #1496b8;
            }

            /* Blue */
            .item:nth-child(5n + 5) {
                background-color: #9d56b8;
            }

            /* Purple */
        </style>
    </head>
    <body>

        <h1>Wrapping Flex Lines</h1>
        <p><code>flex-wrap</code>: wrap, nowrap, wrap-reverse</p>

        <div class="demo-grid">
            <!-- 1. flex-wrap: wrap -->
            <div>
                <div class="label">flex-wrap: <code>wrap</code>;</div>
                <div class="flex-container wrap">
                    <div class="item">1</div>
                    <div class="item">2</div>
                    <div class="item">3</div>
                    <div class="item">4</div>
                    <div class="item">5</div>
                    <div class="item">6</div>
                    <div class="item">7</div>
                    <div class="item">8</div>
                    <div class="item">9</div>
                    <div class="item">10</div>
                </div>
            </div>

            <!-- 2. flex-wrap: wrap-reverse -->
            <div>
                <div class="label">flex-wrap: <code>wrap-reverse</code>;</div>
                <div class="flex-container wrap-reverse">
                    <div class="item">1</div>
                    <div class="item">2</div>
                    <div class="item">3</div>
                    <div class="item">4</div>
                    <div class="item">5</div>
                    <div class="item">6</div>
                    <div class="item">7</div>
                    <div class="item">8</div>
                    <div class="item">9</div>
                    <div class="item">10</div>
                </div>
            </div>

            <!-- 3. flex-wrap: nowrap: Squishes them to fit them inside the container -->
            <div>
                <div class="label">flex-wrap: <code>nowrap</code>; (default)</div>
                <div class="flex-container nowrap">
                    <div class="item">1</div>
                    <div class="item">2</div>
                    <div class="item">3</div>
                    <div class="item">4</div>
                    <div class="item">5</div>
                    <div class="item">6</div>
                    <div class="item">7</div>
                    <div class="item">8</div>
                    <div class="item">9</div>
                    <div class="item">10</div>
                </div>
            </div>
        </div>

    </body>
</html>
