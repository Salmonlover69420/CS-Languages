<html>
    <head>
        <style>
            .flex {
                display: flex;
                flex-direction: row;
            }

            .flex-reverse {
                display: flex;
                flex-direction: row-reverse;
            }

            .box {
                background-color: pink;
                border: 1px solid aqua;
                width: 100px;
                height: 100px;
                text-align: center;
            }
        </style>
    </head>

    <body>
        <!-- Regular row -->
        <div class="flex">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

        <!-- Reversed order of row -->
        <div class="flex-reverse">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

        <!-- Similarly for columns -->
    </body>
</html>
